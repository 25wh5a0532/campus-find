<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Items – CampusFind</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <nav id="main-nav"></nav>

  <!-- Page header -->
  <div class="page-header">
    <div class="container">
      <h1>Browse Lost &amp; Found Items</h1>
      <p>Search through all reported items from the campus community.</p>
    </div>
  </div>

  <section class="section">
    <div class="container">

      <!-- Filters -->
      <div class="browse-filters">
        <div class="filter-group">
          <label for="search-input">Search</label>
          <input type="text" id="search-input" placeholder="Item name, brand, location…" />
        </div>
        <div class="filter-group">
          <label for="filter-type">Type</label>
          <select id="filter-type">
            <option value="">All Types</option>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-category">Category</label>
          <select id="filter-category">
            <option value="">All Categories</option>
            <option value="electronics">💻 Electronics</option>
            <option value="clothing">👕 Clothing</option>
            <option value="accessories">⌚ Accessories</option>
            <option value="books">📚 Books &amp; Notes</option>
            <option value="documents">📄 Documents &amp; ID</option>
            <option value="keys">🔑 Keys</option>
            <option value="bags">👜 Bags &amp; Wallets</option>
            <option value="sports">⚽ Sports</option>
            <option value="other">📦 Other</option>
          </select>
        </div>
        <div class="result-count" id="result-count">0 items found</div>
      </div>

      <!-- Results grid -->
      <div class="items-grid" id="browse-grid"></div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <div class="footer-brand"><div class="nav-logo">🔍</div>CampusFind</div>
      <hr class="footer-divider" />
      <p class="footer-copy">© 2026 CampusFind. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reports.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Pre-fill search or category from URL params
      const params = new URLSearchParams(window.location.search);
      if (params.get('q'))   document.getElementById('search-input').value    = params.get('q');
      if (params.get('cat')) document.getElementById('filter-category').value = params.get('cat');

      initBrowsePage();
    });
  </script>
</body>
</html>
