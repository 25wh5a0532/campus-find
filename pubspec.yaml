name: campus_find
description: CampusFind – A professional Lost & Found platform for campuses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # UI utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # State management (lightweight, no extra deps)
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
