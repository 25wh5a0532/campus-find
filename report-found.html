<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Found Item – CampusFind</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <nav id="main-nav"></nav>

  <div class="report-form-wrap">
    <div class="form-card">

      <div class="form-title">
        <div class="form-title-icon form-title-icon-found">🔍</div>
        <div>
          <h2 id="report-type-label">Report Found Item</h2>
          <p class="text-muted" style="font-size:.875rem">Help return the item to its owner by providing detailed information.</p>
        </div>
      </div>

      <div class="form-error" id="form-error"></div>

      <form id="report-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="item-name">Item Name <span class="required">*</span></label>
            <input type="text" id="item-name" placeholder="e.g. Student ID Card, Headphones" required />
          </div>
          <div class="form-group">
            <label for="category">Category <span class="required">*</span></label>
            <select id="category" required>
              <option value="">Select a category</option>
              <option value="electronics">💻 Electronics</option>
              <option value="clothing">👕 Clothing</option>
              <option value="accessories">⌚ Accessories</option>
              <option value="books">📚 Books &amp; Notes</option>
              <option value="documents">📄 Documents &amp; ID</option>
              <option value="keys">🔑 Keys</option>
              <option value="bags">👜 Bags &amp; Wallets</option>
              <option value="sports">⚽ Sports</option>
              <option value="other">📦 Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description <span class="required">*</span></label>
          <textarea id="description" placeholder="Describe the item in detail — colour, size, distinguishing marks, contents…" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="location">Where Found <span class="required">*</span></label>
            <input type="text" id="location" placeholder="e.g. Cafeteria, Sports Complex, Library" required />
          </div>
          <div class="form-group">
            <label for="date">Date Found <span class="required">*</span></label>
            <input type="date" id="date" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="color">Colour</label>
            <input type="text" id="color" placeholder="e.g. Black, Silver, Blue" />
          </div>
          <div class="form-group">
            <label for="brand">Brand / Make</label>
            <input type="text" id="brand" placeholder="e.g. Apple, Nike, Sony" />
          </div>
        </div>

        <div style="display:flex; gap:12px; margin-top:8px;">
          <a href="dashboard.html" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary" style="flex:1;">Submit Found Report</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <div class="footer-brand"><div class="nav-logo">🔍</div>CampusFind</div>
      <hr class="footer-divider" />
      <p class="footer-copy">© 2026 CampusFind. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reports.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dateInput = document.getElementById('date');
      if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];

      initReportForm('found');
    });
  </script>
</body>
</html>
