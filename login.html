<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – CampusFind</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <nav id="main-nav"></nav>

  <main class="auth-wrap">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">🔍</div>
        <h2>Welcome Back</h2>
        <p>Sign in to your CampusFind account</p>
      </div>

      <div class="form-error" id="form-error"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email"
                 placeholder="you@campus.edu" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-indigo btn-full btn-lg" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="auth-alt">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand"><div class="nav-logo">🔍</div>CampusFind</div>
      <hr class="footer-divider" />
      <p class="footer-copy">© 2026 CampusFind. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.renderNav('login');

      // If already logged in, redirect to dashboard
      Auth.redirectIfLoggedIn('dashboard.html');

      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        App.clearFormError('form-error');

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const btn = document.getElementById('login-btn');
        btn.textContent = 'Signing in…';
        btn.disabled = true;

        const result = Auth.login({ email, password });

        if (result.ok) {
          App.toast('Login successful! Redirecting…', 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
        } else {
          App.showFormError('form-error', result.error);
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
